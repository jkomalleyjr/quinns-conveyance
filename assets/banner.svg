<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#3b4a6b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b4a6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="indigoRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="420" fill="#07070d"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect width="1200" height="420" fill="url(#glow2)"/>

  <!-- glass panel -->
  <rect x="28" y="28" width="1144" height="364" rx="28" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  <rect x="60" y="29.5" width="1080" height="1.5" fill="url(#sheen)" opacity="0.7"/>

  <!-- eyebrow -->
  <text x="76" y="88" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="6" fill="#8B85F0">X402 &#183; HTTP 402 &#183; AGENT PAYMENTS</text>

  <!-- Split Block symbol, aligned to the title block -->
  <g transform="translate(76,112) scale(0.328125)">
    <path fill="#C3CAD6" d="M 121.3,40.6 L 121.3,128.0 L 45.1,84.3 Z"/>
    <path fill="#6E7789" d="M 45.1,84.3 L 121.3,128.0 L 121.3,215.4 L 45.1,171.7 Z"/>
    <path fill="#98A1B3" d="M 134.7,40.6 L 210.9,84.3 L 134.7,128.0 Z"/>
    <path fill="#4F46E5" d="M 134.7,128.0 L 210.9,84.3 L 210.9,171.7 L 134.7,215.4 Z"/>
  </g>

  <!-- title -->
  <text x="184" y="182" font-family="Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#f5f2ea">Quinn<tspan fill="#4F46E5">&#8217;</tspan>s Conveyance</text>

  <!-- indigo rule -->
  <rect x="188" y="208" width="340" height="3" rx="1.5" fill="url(#indigoRule)"/>

  <!-- tagline -->
  <text x="188" y="262" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#c9c9d4">Your API gets paid every time an AI agent calls it.</text>

  <!-- pills -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#e8e6df">
    <rect x="76" y="308" width="352" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="102" cy="330" r="5" fill="#8B85F0"/>
    <text x="120" y="337">Live demo &#8212; settles on Base</text>

    <rect x="448" y="308" width="252" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="474" cy="330" r="5" fill="#8B85F0"/>
    <text x="492" y="337">npm: quinns-x402</text>

    <rect x="720" y="308" width="344" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="746" cy="330" r="5" fill="#8B85F0"/>
    <text x="764" y="337">No custody &#183; data never sold</text>
  </g>
</svg>
